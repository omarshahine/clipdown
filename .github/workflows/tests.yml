name: Tests

on:
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "Package.swift", ".github/workflows/tests.yml"]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: swift test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Build the app and CLI
        run: swift build

      - name: Run tests
        run: swift test
